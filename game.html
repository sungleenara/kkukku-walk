<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>꾸꾸산책</title>
<style>
  html,body{margin:0;height:100%;background:#2f5a2c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{height:100%;display:flex;align-items:center;justify-content:center}
  canvas{display:block}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 480, H = 800;
const FONT = 'system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
const GOAL = 1200;          // 목표 거리 (m)
const PX = 8;               // 1m = 8px
let S = 1, DPR = 1;

function resize() {
  DPR = window.devicePixelRatio || 1;
  const wrap = document.getElementById('wrap');
  S = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
  cv.style.width = W * S + 'px';
  cv.style.height = H * S + 'px';
  cv.width = Math.round(W * S * DPR);
  cv.height = Math.round(H * S * DPR);
}
addEventListener('resize', resize); resize();

// ---------- 유틸 ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[Math.floor(Math.random() * a.length)];
const hyp = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function angLerp(a, t, k) { let d = t - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * k; }

let best = 0;
try { best = +localStorage.getItem('dogwalk_best') || 0; } catch (e) {}

// ---------- 사운드 ----------
let AC = null, muted = false;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, dur, type = 'sine', vol = 0.12, f2) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  pick() { tone(660, .08); setTimeout(() => tone(990, .12), 70); },
  bark() { tone(620, .09, 'square', .06, 360); setTimeout(() => tone(640, .09, 'square', .06, 380), 140); },
  hurt() { tone(220, .35, 'sawtooth', .1, 80); },
  bell() { tone(1900, .18, 'triangle', .05); setTimeout(() => tone(1900, .18, 'triangle', .05), 160); },
  sniff() { [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, .12, 'sine', .08), i * 80)); },
  good() { [784, 988, 1175].forEach((f, i) => setTimeout(() => tone(f, .12, 'triangle', .08), i * 70)); },
  bad() { tone(300, .2, 'square', .05, 200); },
  clear() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .18, 'triangle', .09), i * 120)); },
};

// ---------- 입력 ----------
const keys = {};
let pickPressed = false, swapPressed = false, isTouch = false;
const joy = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0 };
const btnPick = { x: 405, y: 712, r: 50, id: null, label: '줍기', icon: '💩' };
const btnPull = { x: 290, y: 738, r: 42, id: null, down: false, label: '꽉 잡기', icon: '✊' };
const btnSwap = { x: 412, y: 610, r: 36, id: null, label: '교대', icon: '🔁' };

addEventListener('keydown', e => {
  initAudio();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) { keys[e.code] = true; return; }
  keys[e.code] = true;
  if (e.code === 'KeyM') muted = !muted;
  if (state === 'play') {
    if (e.code === 'KeyE' || e.code === 'KeyJ' || e.code === 'Enter') pickPressed = true;
    if (e.code === 'KeyQ' || e.code === 'KeyK' || e.code === 'Tab') { swapPressed = true; e.preventDefault(); }
    if (e.code === 'KeyP' || e.code === 'Escape') state = 'pause';
  } else if (state === 'pause') {
    if (['KeyP', 'Escape', 'Space', 'Enter'].includes(e.code)) state = 'play';
  } else if (e.code === 'Space' || e.code === 'Enter') menuAction();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') state = 'pause'; });

function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  initAudio();
  e.preventDefault();
  if (e.pointerType === 'touch') isTouch = true;
  const p = toLogical(e);
  if (state === 'pause') { state = 'play'; return; }
  if (state !== 'play') { menuAction(); return; }
  if (p.x > 420 && p.y < 110 && p.y > 90) { state = 'pause'; return; }
  if (isTouch && hyp(p, btnPick) < btnPick.r + 6) { btnPick.id = e.pointerId; pickPressed = true; return; }
  if (isTouch && hyp(p, btnPull) < btnPull.r + 6) { btnPull.id = e.pointerId; btnPull.down = true; return; }
  if (isTouch && hyp(p, btnSwap) < btnSwap.r + 6) { btnSwap.id = e.pointerId; swapPressed = true; return; }
  if (!joy.active) {
    joy.active = true; joy.id = e.pointerId; joy.ox = joy.x = p.x; joy.oy = joy.y = p.y; joy.dx = joy.dy = 0;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  const p = toLogical(e);
  let dx = p.x - joy.ox, dy = p.y - joy.oy; const l = Math.hypot(dx, dy), R = 55;
  if (l > R) { dx = dx / l * R; dy = dy / l * R; }
  joy.x = joy.ox + dx; joy.y = joy.oy + dy;
  joy.dx = dx / R; joy.dy = dy / R;
});
function releasePtr(e) {
  if (e.pointerId === joy.id) { joy.active = false; joy.id = null; joy.dx = joy.dy = 0; }
  if (e.pointerId === btnPull.id) { btnPull.down = false; btnPull.id = null; }
  if (e.pointerId === btnPick.id) btnPick.id = null;
  if (e.pointerId === btnSwap.id) btnSwap.id = null;
}
cv.addEventListener('pointerup', releasePtr);
cv.addEventListener('pointercancel', releasePtr);
cv.addEventListener('contextmenu', e => e.preventDefault());

const keyName = k => isTouch ? ({ pull: '꽉 잡기 버튼', pick: '줍기 버튼', swap: '교대 버튼' })[k] : ({ pull: 'Space', pick: 'E', swap: 'Q' })[k];

// ---------- 게임 상태 ----------
let state = 'title', G = null, endT = 0;

function newGame() {
  G = {
    owner: { man: true, x: 240, y: 0, face: -Math.PI / 2, anim: 0, moving: false, side: 1, task: null },      // 목줄 잡은 사람 (조작)
    partner: { man: false, x: 206, y: 6, face: -Math.PI / 2, anim: 0, moving: false, side: -1, task: null }, // 옆에서 같이 걷는 사람
    dog: { x: 240, y: -90, vx: 0, vy: 0, ang: -Math.PI / 2, step: 0, state: 'walk', t: 0, target: null,
           wanderT: 0, wx: 240, wy: -200, poopT: rand(9, 13), calm: 3, calmP: 0 },
    camY: -H * 0.62, items: [], decor: [], fx: [], texts: [],
    nextY: -260, nextDecorY: 200,
    score: 0, hap: 80, hearts: 3, inv: 0, dragT: 0, missed: 0, sniffs: 0, bones: 0, goodBoy: 0, picked: 0, swaps: 0, swapHint: false,
    time: 0, msg: null, shake: 0, maxDist: 0, firstSq: true, firstPoop: true, reason: '', pull: false
  };
  say('꾸꾸와 함께 ' + GOAL + 'm 산책을 완주하세요!', 3);
}
function startGame() { newGame(); state = 'play'; }
function menuAction() {
  if (state === 'title') startGame();
  else if ((state === 'over' || state === 'clear') && performance.now() - endT > 700) startGame();
}

function say(t, dur = 2.2) { G.msg = { t, life: dur, max: dur }; }
const who = p => p.man ? '남자' : '여자';
function talk(p, t) { txt(p.x, p.y - 30, t, p.man ? '#cfe3ff' : '#ffd1e0', 14); }
const theMan = () => G.owner.man ? G.owner : G.partner;
function pickPoop(pp) {
  pp.dead = true; G.score += 15; G.picked++;
  txt(pp.x, pp.y - 20, '+15 매너 산책 👍', '#b9f6ca'); burst(pp.x, pp.y, 'star', 6); sfx.pick();
}
function txt(x, y, t, col = '#fff', size = 18) { G.texts.push({ x, y, t, col, size, life: 1.3 }); }
function burst(x, y, kind, n) {
  for (let i = 0; i < n; i++) G.fx.push({ x, y, vx: rand(-40, 40), vy: rand(-90, -30), life: rand(.7, 1.2), kind });
}
const dist = () => G.maxDist;

function hurt(msg) {
  if (G.inv > 0) return;
  G.hearts--; G.inv = 1.8; G.shake = 0.35; G.hap = Math.max(0, G.hap - 6);
  say(msg, 1.8); sfx.hurt();
  if (G.hearts <= 0) gameOver('하트를 모두 잃었어요 💔');
}
function gameOver(reason) {
  G.reason = reason; state = 'over'; endT = performance.now();
  G.total = G.score;
  if (G.total > best) { best = G.total; try { localStorage.setItem('dogwalk_best', best); } catch (e) {} }
}
function gameClear() {
  state = 'clear'; endT = performance.now(); sfx.clear();
  G.bonusHap = Math.floor(G.hap) * 2; G.bonusHeart = G.hearts * 30;
  G.total = G.score + G.bonusHap + G.bonusHeart;
  G.stars = (G.hap >= 60 && G.missed === 0 && G.hearts === 3) ? 3 : (G.hap >= 35 && G.missed <= 1) ? 2 : 1;
  if (G.total > best) { best = G.total; try { localStorage.setItem('dogwalk_best', best); } catch (e) {} }
}

// ---------- 스폰 ----------
const goalY = -GOAL * PX;
function spawnRow(y) {
  if (y < goalY + 150) return;
  const m = -y / PX;
  const bikeP = m > 80 ? 0.10 + Math.min(0.10, m / 10000) : 0;
  const sqP = m > 50 ? 0.085 : 0;
  const r = Math.random();
  if (r < 0.30) G.items.push({ type: 'bone', x: rand(160, 320), y, rot: rand(0, 3) });
  else if (r < 0.54) {
    const left = Math.random() < .5;
    G.items.push({ type: 'spot', kind: pick(['hydrant', 'lamp', 'bush', 'sign', 'bush']), x: left ? rand(112, 132) : rand(348, 368), y, prog: 0, done: false });
  } else if (r < 0.54 + bikeP) {
    G.items.push({ type: 'bike', x: rand(170, 310), y: y - 120, vy: rand(120, 160) + m * 0.06, col: pick(['#3b7dd8', '#e0527a', '#8a5cd6', '#f08a24', '#23a39a']), rang: false });
  } else if (r < 0.54 + bikeP + sqP) {
    const left = Math.random() < .5;
    G.items.push({ type: 'squirrel', x: left ? -20 : 500, y, vx: (left ? 1 : -1) * rand(85, 120), ph: 0, onscreen: false });
  }
}
function spawnDecor(y) {
  const left = Math.random() < .5;
  if (Math.random() < 0.72) G.decor.push({ type: 'tree', x: left ? rand(10, 92) : rand(388, 470), y, r: rand(26, 40), shade: rand(0, 1) });
  if (Math.random() < 0.5) G.decor.push({ type: 'flowers', x: left ? rand(380, 470) : rand(10, 100), y: y + rand(-30, 30), c: pick(['#ff8fb1', '#ffd34d', '#ffffff', '#c58cff']) });
}

// ---------- 업데이트 ----------
function steer(d, tx, ty, speed, dt, acc = 6) {
  const dx = tx - d.x, dy = ty - d.y, l = Math.hypot(dx, dy);
  let vx = 0, vy = 0;
  if (l > 3) { vx = dx / l * speed; vy = dy / l * speed; if (l < 30) { vx *= l / 30; vy *= l / 30; } }
  const k = Math.min(1, acc * dt);
  d.vx += (vx - d.vx) * k; d.vy += (vy - d.vy) * k;
}

function update(dt) {
  G.time += dt;
  const o = G.owner, d = G.dog;
  G.inv = Math.max(0, G.inv - dt); G.shake = Math.max(0, G.shake - dt);

  // --- 주인 이동 ---
  let ix = 0, iy = 0;
  if (keys.ArrowLeft || keys.KeyA) ix--;
  if (keys.ArrowRight || keys.KeyD) ix++;
  if (keys.ArrowUp || keys.KeyW) iy--;
  if (keys.ArrowDown || keys.KeyS) iy++;
  if (joy.active) { ix += joy.dx; iy += joy.dy; }
  const il = Math.hypot(ix, iy); if (il > 1) { ix /= il; iy /= il; }
  const pull = !!(keys.Space || btnPull.down);
  G.pull = pull;
  const spd = pull ? 125 : 175;
  o.x += ix * spd * dt; o.y += iy * spd * dt;
  o.moving = il > 0.15;
  if (o.moving) { o.anim += dt * 11; o.face = angLerp(o.face, Math.atan2(iy, ix), Math.min(1, dt * 12)); }

  // --- 강아지 AI ---
  d.calm -= dt; d.poopT -= dt;
  if (d.state === 'walk' && d.calm <= 0) {
    const sq = G.items.find(it => it.type === 'squirrel' && it.onscreen && hyp(it, d) < 250);
    if (sq) {
      d.state = 'chase'; d.target = sq; d.calmP = 0; sfx.bark();
      txt(d.x, d.y - 30, '멍멍!!', '#fff', 22);
      talk(G.partner, '꾸꾸야 안 돼!');
      if (G.firstSq) { say('다람쥐다! ' + keyName('pull') + ' 꾹 눌러서 진정시켜요', 3); G.firstSq = false; }
    }
  }
  if (d.state === 'walk' && d.poopT <= 0) { d.state = 'poop'; d.t = 1.6; }

  if (d.state === 'walk') {
    let bestIt = null, bd = 1e9;
    for (const it of G.items) {
      if (it.type === 'bone' || (it.type === 'spot' && !it.done)) {
        if (hyp(it, o) < 230 && it.y < o.y + 90 && it.y > G.camY + 20) {
          const dd = hyp(it, d); if (dd < bd) { bd = dd; bestIt = it; }
        }
      }
    }
    if (bestIt) {
      steer(d, bestIt.x, bestIt.y + (bestIt.type === 'spot' ? 16 : 0), 170, dt);
      if (bestIt.type === 'spot' && bd < 28) { d.state = 'sniff'; d.target = bestIt; }
    } else {
      d.wanderT -= dt;
      if (d.wanderT <= 0) { d.wanderT = rand(1, 2.2); d.wx = clamp(o.x + rand(-90, 90), 30, 450); d.wy = o.y - rand(70, 130); }
      steer(d, d.wx, Math.min(d.wy, o.y - 55), o.moving ? 195 : 110, dt);
    }
  } else if (d.state === 'sniff') {
    const sp = d.target;
    d.vx *= 0.8; d.vy *= 0.8;
    sp.prog += dt / 1.7;
    if (Math.random() < dt * 6) G.fx.push({ x: sp.x + rand(-8, 8), y: sp.y, vx: rand(-10, 10), vy: -40, life: .8, kind: 'smell' });
    if (hyp(sp, d) > 38) { d.state = 'walk'; }
    else if (sp.prog >= 1) {
      sp.done = true; d.state = 'walk'; G.sniffs++;
      G.hap = Math.min(100, G.hap + 18); G.score += 20;
      txt(sp.x, sp.y - 26, '+20 킁킁 완료!', '#fff59d'); burst(d.x, d.y - 10, 'heart', 6); sfx.sniff();
      if (Math.random() < .5) talk(G.partner, pick(['잘했어 꾸꾸!', '꾸꾸 신났네~', '킁킁 재밌지?']));
    }
  } else if (d.state === 'poop') {
    d.vx *= 0.8; d.vy *= 0.8; d.t -= dt;
    if (d.t <= 0) {
      G.items.push({ type: 'poop', x: d.x - Math.cos(d.ang) * 16, y: d.y - Math.sin(d.ang) * 16, t: 0 });
      d.poopT = rand(13, 20); d.state = 'walk';
      if (G.firstPoop) { say(G.owner.man ? '💩 응가! 남자가 가까이 가서 ' + keyName('pick') + '로 치워요' : '💩 응가! ' + keyName('pick') + '를 누르면 남자가 치우러 가요', 3.2); G.firstPoop = false; }
      else txt(d.x, d.y - 28, '응가 💩', '#fff');
    }
  } else if (d.state === 'chase') {
    const sq = d.target;
    if (!G.items.includes(sq) || !sq.onscreen) { d.state = 'walk'; d.calm = 2.5; }
    else {
      steer(d, sq.x, sq.y, 330, dt, 10);
      if (pull) {
        d.calmP += dt;
        if (d.calmP >= 1.1) {
          d.state = 'walk'; d.calm = 5; G.score += 25; G.goodBoy++; G.hap = Math.min(100, G.hap + 4);
          txt(d.x, d.y - 30, '+25 기다려! 착하다', '#b9f6ca'); sfx.good();
        }
      } else d.calmP = Math.max(0, d.calmP - dt * 0.5);
    }
  }

  d.x += d.vx * dt; d.y += d.vy * dt;

  // --- 목줄 제약 ---
  const L = pull ? 72 : 135;
  const dx = d.x - o.x, dy = d.y - o.y, dd = Math.hypot(dx, dy);
  let dragged = false;
  if (dd > L) {
    const ex = dd - L, nx = dx / dd, ny = dy / dd;
    const sh = d.state === 'chase' ? (pull ? 0.08 : 0.72) : (pull ? 0.03 : 0.1);
    o.x += nx * ex * sh; o.y += ny * ex * sh;
    d.x -= nx * ex * (1 - sh); d.y -= ny * ex * (1 - sh);
    const vd = d.vx * nx + d.vy * ny;
    if (vd > 0 && d.state !== 'chase') { d.vx -= vd * nx; d.vy -= vd * ny; }
    if (d.state === 'chase' && !pull && ex > 0.3) dragged = true;
  }
  if (dragged) {
    G.dragT += dt;
    o.face = angLerp(o.face, Math.atan2(dy, dx), Math.min(1, dt * 10)); o.anim += dt * 16;
    if (G.dragT > 1.7) { G.dragT = 0; d.state = 'walk'; d.calm = 4; hurt('꽈당! 끌려가다 넘어졌어요'); }
  } else G.dragT = Math.max(0, G.dragT - dt);

  // 화면 경계
  o.x = clamp(o.x, 14, W - 14); o.y = Math.min(o.y, G.camY + H - 30);
  d.x = clamp(d.x, 10, W - 10); d.y = Math.min(d.y, G.camY + H - 12);

  // 같이 걷는 사람: 옆에서 따라오거나, 남자라면 응가를 치우러 감
  const pt = G.partner;
  if (pt.task && (pt.task.dead || !G.items.includes(pt.task))) pt.task = null;
  if (o.x < 70) pt.side = 1; else if (o.x > W - 70) pt.side = -1;
  const ptx = pt.task ? pt.task.x : o.x + pt.side * 34, pty = pt.task ? pt.task.y + 10 : o.y + 6;
  const pdx = ptx - pt.x, pdy = pty - pt.y, pl = Math.hypot(pdx, pdy);
  const psp = pt.task ? 230 : Math.min(240, pl * 6);
  pt.moving = psp > 25 && pl > 2;
  if (pl > 1) {
    const stepL = Math.min(pl, psp * dt);
    pt.x += pdx / pl * stepL; pt.y += pdy / pl * stepL;
    if (pt.moving) { pt.face = angLerp(pt.face, Math.atan2(pdy, pdx), Math.min(1, dt * 8)); pt.anim += dt * 11; }
  }
  if (!pt.moving) pt.face = angLerp(pt.face, o.face, Math.min(1, dt * 4));
  if (pt.task && pl < 14) { pickPoop(pt.task); talk(pt, pick(['깨끗하게 치웠어!', '매너 산책!', '다 치웠다~'])); pt.task = null; }
  pt.x = clamp(pt.x, 14, W - 14); pt.y = Math.min(pt.y, G.camY + H - 30);

  // 목줄 교대
  if (!G.swapHint && dist() > 120) { G.swapHint = true; say('🔁 ' + keyName('swap') + '로 목줄을 번갈아 잡을 수 있어요', 3); }
  if (swapPressed) {
    swapPressed = false;
    if (d.state === 'chase') say('다람쥐 쫓는 중엔 목줄을 넘길 수 없어요!', 1.6);
    else if (pt.task) say('남자가 응가 치우는 중이에요', 1.6);
    else if (hyp(o, pt) > 75) say('둘이 더 가까이 있어야 넘겨줄 수 있어요', 1.6);
    else {
      G.owner = pt; G.partner = o; G.swaps++;
      G.partner.side = Math.sign(G.partner.x - G.owner.x) || -1;
      G.owner.face = o.face;
      talk(G.owner, '내가 잡을게!');
      say('🔁 목줄 교대! 이제 ' + who(G.owner) + '가 잡아요', 1.6); sfx.pick();
    }
  }

  // 강아지 방향/걸음
  const dsp = Math.hypot(d.vx, d.vy);
  if (d.state === 'sniff') d.ang = angLerp(d.ang, Math.atan2(d.target.y - d.y, d.target.x - d.x), Math.min(1, dt * 8));
  else if (dsp > 15) d.ang = angLerp(d.ang, Math.atan2(d.vy, d.vx), Math.min(1, dt * 10));
  d.step += dsp * dt * 0.12;

  // 카메라
  const tc = o.y - H * 0.62;
  if (tc < G.camY) G.camY += (tc - G.camY) * Math.min(1, dt * 5);
  G.maxDist = Math.max(G.maxDist, -o.y / PX);

  // 스폰
  while (G.nextY > G.camY - 320) { spawnRow(G.nextY); G.nextY -= rand(85, 140); }
  while (G.nextDecorY > G.camY - 320) { spawnDecor(G.nextDecorY); G.nextDecorY -= rand(45, 85); }

  // --- 아이템 ---
  for (const it of G.items) {
    if (it.type === 'bone') {
      if (hyp(d, it) < 22) { it.dead = true; G.score += 10; G.bones++; G.hap = Math.min(100, G.hap + 6); txt(it.x, it.y - 20, '+10 🦴', '#fff'); burst(it.x, it.y, 'star', 5); sfx.pick(); }
    } else if (it.type === 'bike') {
      it.y += it.vy * dt;
      if (!it.rang && it.y > G.camY - 80) { it.rang = true; sfx.bell(); }
      if (G.inv <= 0 && (Math.hypot(o.x - it.x, o.y - it.y) < 26 || Math.hypot(d.x - it.x, d.y - it.y) < 22 ||
          Math.hypot(G.partner.x - it.x, G.partner.y - it.y) < 24)) hurt('🚲 자전거 조심!');
    } else if (it.type === 'squirrel') {
      it.onscreen = it.y > G.camY + 30 && it.y < G.camY + H - 30 && it.x > -10 && it.x < W + 10;
      if (it.y > G.camY + 40) {
        const near = hyp(d, it) < 100;
        it.x += it.vx * (near ? 2.1 : 1) * dt; it.ph += dt * (near ? 24 : 12);
      }
      if ((it.vx > 0 && it.x > W + 40) || (it.vx < 0 && it.x < -40)) it.dead = true;
    } else if (it.type === 'poop') it.t += dt;

    if (it.y > G.camY + H + 60 && !it.dead) {
      if (it.type === 'poop') { G.score -= 20; G.missed++; G.hap = Math.max(0, G.hap - 5); say('응가를 안 치우고 지나갔어요… -20', 2); sfx.bad(); }
      it.dead = true;
    }
  }

  // 줍기 (응가는 남자 담당)
  if (pickPressed) {
    pickPressed = false;
    const man = theMan(), poops = G.items.filter(it => it.type === 'poop' && !it.dead);
    let pp = null, pd = man === G.owner ? 55 : 320;
    for (const it of poops) { const q = hyp(it, man); if (q < pd && it.y < G.camY + H - 10) { pd = q; pp = it; } }
    if (man === G.owner) {
      if (pp) pickPoop(pp);
      else txt(man.x, man.y - 34, poops.length ? '더 가까이 가야 해요' : '주울 게 없어요', 'rgba(255,255,255,.85)', 14);
    } else if (man.task) talk(man, '지금 치우러 가는 중!');
    else if (pp) { man.task = pp; talk(man, '내가 치울게!'); }
    else talk(man, '치울 게 없는데?');
  }

  G.items = G.items.filter(it => !it.dead);
  G.decor = G.decor.filter(t => t.y < G.camY + H + 120);

  // 이펙트
  for (const f of G.fx) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 30 * dt; f.life -= dt; }
  G.fx = G.fx.filter(f => f.life > 0);
  for (const t of G.texts) { t.y -= 30 * dt; t.life -= dt; }
  G.texts = G.texts.filter(t => t.life > 0);
  if (G.msg) { G.msg.life -= dt; if (G.msg.life <= 0) G.msg = null; }

  // 기분
  const decay = 1.25 + dist() / 1400;
  G.hap = clamp(G.hap - decay * dt, 0, 100);
  if (G.hap < 25 && Math.random() < dt * 0.6) txt(d.x, d.y - 26, pick(['심심해…', '킁…', '놀아줘!']), 'rgba(255,255,255,.85)', 14);

  if (G.hap <= 0) gameOver('꾸꾸가 너무 지루해했어요 😢');
  else if (dist() >= GOAL) gameClear();
}

// ---------- 그리기 ----------
const sy = y => y - G.camY;
function circle(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ell(x, y, rx, ry, c, rot = 0) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); }
function rr(x, y, w, h, r, c, stroke) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (c) { ctx.fillStyle = c; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
}
function text(t, x, y, size, col = '#333', align = 'center', weight = 'bold') {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.fillStyle = col; ctx.fillText(t, x, y);
}
function textOutline(t, x, y, size, col = '#fff') {
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = 'center';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(40,50,30,.75)'; ctx.lineJoin = 'round'; ctx.strokeText(t, x, y);
  ctx.fillStyle = col; ctx.fillText(t, x, y);
}

function drawGround() {
  ctx.fillStyle = '#86c96a'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#7dbf62';
  const b = 64, k0 = Math.floor(G.camY / b);
  for (let k = k0; k * b < G.camY + H; k++) if (((k % 2) + 2) % 2) ctx.fillRect(0, sy(k * b), W, b);
  // 산책로
  ctx.fillStyle = '#d6c08f'; ctx.fillRect(136, 0, 208, H);
  ctx.fillStyle = '#ecdcb3'; ctx.fillRect(142, 0, 196, H);
  // 자갈
  const t = 40, j0 = Math.floor(G.camY / t);
  for (let j = j0; j * t < G.camY + H; j++) {
    for (let q = 0; q < 3; q++) {
      const h1 = hash(j * 7 + q), h2 = hash(j * 13 + q * 3);
      ell(150 + h1 * 180, sy(j * t + h2 * t), 2.5 + h2 * 2, 1.8 + h1, 'rgba(160,135,90,.35)');
    }
  }
  // 거리 표지
  const m0 = Math.floor(G.camY / (100 * PX));
  for (let m = m0; m * 100 * PX < G.camY + H; m++) {
    const yy = m * 100 * PX, meters = -m * 100;
    if (meters <= 0 || meters >= GOAL) continue;
    rr(300, sy(yy) - 11, 50, 22, 6, 'rgba(255,255,255,.75)');
    text(meters + 'm', 325, sy(yy) + 1, 13, '#6b5a3a');
  }
  // 결승선
  const gy = sy(goalY);
  if (gy > -60 && gy < H + 60) {
    for (let i = 0; i < 13; i++) for (let r = 0; r < 2; r++) {
      ctx.fillStyle = (i + r) % 2 ? '#222' : '#fff'; ctx.fillRect(142 + i * 15.1, gy - 15 + r * 15, 15.1, 15);
    }
    rr(170, gy - 70, 140, 40, 10, '#ff7a59');
    text('🏁 도착!', 240, gy - 49, 20, '#fff');
    ctx.fillStyle = '#8a5a2b'; ctx.fillRect(136, gy - 60, 6, 60); ctx.fillRect(338, gy - 60, 6, 60);
  }
  // 출발 지점
  const s0 = sy(40);
  if (s0 < H + 40) { rr(185, s0 - 12, 110, 24, 8, 'rgba(255,255,255,.7)'); text('출발 🐾', 240, s0 + 1, 14, '#6b5a3a'); }
}

function drawFlowers(f) {
  const y = sy(f.y);
  for (let i = 0; i < 5; i++) {
    const a = i * 1.26 + f.x, rx = Math.cos(a) * 9, ry = Math.sin(a) * 6;
    circle(f.x + rx, y + ry, 3, f.c); circle(f.x + rx, y + ry, 1.2, '#f5c242');
  }
}
function drawTree(t) {
  const y = sy(t.y);
  ell(t.x + 8, y + 10, t.r, t.r * 0.8, 'rgba(0,0,0,.15)');
  const near = Math.hypot(G.owner.x - t.x, G.owner.y - t.y) < t.r + 10 || Math.hypot(G.dog.x - t.x, G.dog.y - t.y) < t.r + 6;
  ctx.globalAlpha = near ? 0.55 : 1;
  circle(t.x, y, t.r, t.shade > .5 ? '#3f8a3a' : '#468f3c');
  circle(t.x - t.r * .25, y - t.r * .25, t.r * .7, t.shade > .5 ? '#55a34a' : '#5cab4c');
  circle(t.x - t.r * .4, y - t.r * .4, t.r * .3, 'rgba(255,255,255,.12)');
  ctx.globalAlpha = 1;
}

function drawSpot(s) {
  const x = s.x, y = sy(s.y);
  ell(x + 3, y + 5, 13, 8, 'rgba(0,0,0,.15)');
  if (s.kind === 'hydrant') {
    circle(x, y, 11, '#d93b3b'); circle(x, y, 7, '#f05a5a'); circle(x, y, 3, '#b52a2a');
    ctx.fillStyle = '#c83434'; ctx.fillRect(x - 15, y - 3, 6, 6); ctx.fillRect(x + 9, y - 3, 6, 6);
  } else if (s.kind === 'lamp') {
    circle(x, y, 9, '#5b6470'); circle(x, y, 5, '#7b8592');
    ctx.strokeStyle = '#5b6470'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 22); ctx.stroke();
    circle(x, y - 24, 7, '#fff3b0'); circle(x, y - 24, 4, '#ffe066');
  } else if (s.kind === 'bush') {
    circle(x - 7, y + 2, 10, '#3e8e3e'); circle(x + 7, y + 2, 10, '#3e8e3e'); circle(x, y - 6, 11, '#4ea24a');
    for (let i = 0; i < 4; i++) circle(x + Math.cos(i * 1.7) * 9, y - 2 + Math.sin(i * 1.7) * 7, 2.5, '#ff8fb1');
  } else {
    ctx.fillStyle = '#7a5532'; ctx.fillRect(x - 2, y - 6, 4, 14);
    rr(x - 16, y - 22, 32, 18, 4, '#a8794a'); text('🐾', x, y - 12, 11);
  }
  // 냄새 표시
  if (!s.done) {
    const t = G.time * 3 + s.x;
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
    for (let i = -1; i <= 1; i++) {
      const ox = x + i * 7, ph = (t + i) % 3 / 3;
      ctx.globalAlpha = 1 - ph; ctx.beginPath();
      for (let k = 0; k < 8; k++) { const yy = y - 18 - ph * 16 - k * 2; ctx.lineTo(ox + Math.sin(k * .9 + t * 2) * 2.5, yy); }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (s.prog > 0) {
      ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(x, y, 18, -Math.PI / 2, -Math.PI / 2 + s.prog * Math.PI * 2); ctx.stroke();
    }
  } else {
    circle(x + 12, y - 12, 7, '#4caf50'); text('✓', x + 12, y - 11, 11, '#fff');
  }
}

function drawBone(b) {
  const x = b.x, y = sy(b.y) + Math.sin(G.time * 4 + b.x) * 2;
  ell(x + 2, y + 6, 12, 4, 'rgba(0,0,0,.15)');
  ctx.save(); ctx.translate(x, y); ctx.rotate(b.rot);
  ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = '#c9b48a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.rect(-9, -3, 18, 6); ctx.fill(); ctx.stroke();
  for (const [cx, cy] of [[-10, -3.5], [-10, 3.5], [10, -3.5], [10, 3.5]]) {
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.fillRect(-9, -3, 18, 6);
  ctx.restore();
}

function drawPoop(p) {
  const x = p.x, y = sy(p.y);
  ell(x + 1, y + 4, 9, 4, 'rgba(0,0,0,.18)');
  ell(x, y + 1, 9, 5, '#7a4a22'); ell(x, y - 3, 6.5, 4, '#8b5a2b'); ell(x + 1, y - 6.5, 3.5, 3, '#9a6532');
  // 파리
  const t = G.time * 5 + p.x;
  circle(x + Math.cos(t) * 12, y - 10 + Math.sin(t * 1.7) * 5, 1.4, '#333');
  // 주인이 가까우면 표시
  const man = theMan(), bob = Math.sin(G.time * 8) * 3;
  const near = man === G.owner ? hyp(p, man) < 55 : hyp(p, man) < 320 && !man.task;
  const label = man.task === p ? '치우는 중…' : (isTouch ? '' : 'E ') + (man === G.owner ? '줍기' : '남자가 줍기');
  if (near || man.task === p) {
    ctx.font = `bold 12px ${FONT}`; const lw = ctx.measureText(label).width + 16;
    rr(x - lw / 2, y - 38 + bob, lw, 20, 8, '#ffeb3b'); text(label, x, y - 27 + bob, 12, '#5a4200');
  }
  else { ctx.globalAlpha = .8 + Math.sin(G.time * 6) * .2; text('!', x, y - 18 + bob, 16, '#ff5252'); ctx.globalAlpha = 1; }
}

function drawBike(b) {
  const x = b.x, y = sy(b.y);
  ell(x + 4, y + 6, 12, 24, 'rgba(0,0,0,.15)');
  ctx.fillStyle = '#2b2b2b'; rr(x - 2.5, y - 26, 5, 15, 2, '#2b2b2b'); rr(x - 2.5, y + 11, 5, 15, 2, '#2b2b2b');
  ctx.strokeStyle = '#999'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y - 14); ctx.lineTo(x, y + 14); ctx.stroke();
  ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x - 11, y + 13); ctx.lineTo(x + 11, y + 13); ctx.stroke();
  ell(x, y, 13, 8, b.col);
  circle(x - 11, y + 9, 3, '#f1c7a0'); circle(x + 11, y + 9, 3, '#f1c7a0');
  circle(x, y + 1, 7, '#fafafa'); circle(x, y + 1, 7.5, 'rgba(0,0,0,0)');
  ctx.strokeStyle = b.col; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y + 1, 5, 0, Math.PI * 2); ctx.stroke();
}

function drawSquirrel(s) {
  const x = s.x, y = sy(s.y), dir = s.vx > 0 ? 1 : -1, hop = Math.abs(Math.sin(s.ph)) * 4;
  ell(x, y + 6, 12, 4, 'rgba(0,0,0,.15)');
  ctx.save(); ctx.translate(x, y - hop); ctx.scale(dir, 1);
  // 꼬리
  ctx.fillStyle = '#a0612c'; ctx.beginPath(); ctx.ellipse(-12, -6, 7, 11, -0.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c47a3a'; ctx.beginPath(); ctx.ellipse(-12, -7, 4, 8, -0.5, 0, Math.PI * 2); ctx.fill();
  ell(0, 0, 9, 6, '#b06d33'); circle(8, -3, 5, '#b06d33');
  circle(10, -4, 1.3, '#111'); circle(7, -8, 2, '#8d5226');
  ell(-1, 1, 5, 3, '#e8c39a');
  ctx.restore();
}

// 풍성한 털 실루엣: 부드럽게 뭉친 털뭉치가 뒤쪽(-x)으로 흘러요
function furBlob(cx, cy, rx, ry, col, n, spike, seed, sweep = 0.14) {
  ctx.fillStyle = col; ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2, am = (a0 + a1) / 2;
    const k = 1 + spike * (0.6 + hash(seed + i) * 0.8);
    const at = am + sweep * Math.sign(Math.sin(am));
    if (i === 0) ctx.moveTo(cx + Math.cos(a0) * rx, cy + Math.sin(a0) * ry);
    ctx.quadraticCurveTo(cx + Math.cos(at) * rx * k, cy + Math.sin(at) * ry * k,
                         cx + Math.cos(a1) * rx, cy + Math.sin(a1) * ry);
  }
  ctx.closePath(); ctx.fill();
}
function furStrands(cx, cy, rx, ry, n, seed) {
  ctx.strokeStyle = 'rgba(200,207,218,.45)'; ctx.lineWidth = 1; ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const px = cx + (hash(seed + i) - .5) * rx * 1.5, py = cy + (hash(seed + i * 3.1) - .5) * ry * 1.5;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.quadraticCurveTo(px - 3, py + (py - cy) * .12, px - 5.5, py + (py - cy) * .25); ctx.stroke();
  }
}
function tri(x1, y1, x2, y2, x3, y3) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.closePath(); ctx.fill(); }

// 하얀 스피츠 꾸꾸 (위에서 본 모습, +x 방향이 앞)
function drawSpitz(x, y, ang, o) {
  const line = '#cdd3dc', fur = '#ffffff', cream = '#f3f5f8';
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  const st = o.moving ? Math.sin(o.step) * 3.5 : 0;
  const puff = 1 + Math.sin(o.time * 3) * 0.015;              // 숨 쉴 때 털이 살짝 부풀어요
  // 짧은 다리 (털에 거의 묻힘)
  ell(11 + st, -11, 3.5, 3, line); ell(11 - st, 11, 3.5, 3, line);
  ell(-11 - st, -10, 3.5, 3, line); ell(-11 + st, 10, 3.5, 3, line);
  // 몸통 털
  furBlob(-1, 0, 17.5 * puff, 12.5 * puff, line, 20, 0.42, 11);
  furBlob(-1, 0, 16.5 * puff, 11.5 * puff, fur, 20, 0.4, 11);
  furStrands(-3, 0, 12, 8, 7, 5);
  // 사자 갈기 같은 목둘레 털 (스피츠 특징)
  furBlob(14, 0, 12 * puff, 15.5 * puff, line, 18, 0.45, 23, 0.3);
  furBlob(14, 0, 11 * puff, 14.5 * puff, fur, 18, 0.43, 23, 0.3);
  ell(13, 0, 6.5, 10.5, cream);
  furStrands(12, 0, 7, 11, 6, 17);
  // 등 위로 말린 풍성한 꼬리
  const wagSpeed = o.state === 'chase' ? 28 : 6 + o.hap / 9;
  const wagAmp = o.hap < 20 ? 0.6 : 2.6;
  ctx.save(); ctx.translate(-9, Math.sin(o.time * wagSpeed) * wagAmp);
  furBlob(0, 0, 10.5, 9.5, line, 16, 0.5, 41, 0.35);
  furBlob(0, 0, 9.5, 8.5, fur, 16, 0.48, 41, 0.35);
  ell(1, 0, 5, 4, cream);
  furStrands(-1, 0, 7, 6, 5, 29);
  ctx.restore();
  // 머리 (여우 같은 얼굴)
  ctx.save(); ctx.translate(23, 0);
  if (o.state === 'sniff') ctx.translate(Math.sin(o.time * 25), 0);
  // 작고 뾰족한 귀
  for (const s of [-1, 1]) {
    ctx.fillStyle = line; tri(-4.5, s * 3.5, -6.5, s * 12.5, 1.5, s * 6.5);
    ctx.fillStyle = fur; tri(-3.8, s * 4, -5.9, s * 11.2, 0.8, s * 6.3);
    ctx.fillStyle = '#f7c3cd'; tri(-3.2, s * 5.2, -4.8, s * 9.4, -0.6, s * 6.2);
  }
  furBlob(0, 0, 8.4, 9, line, 14, 0.28, 61, 0.35);
  furBlob(0, 0, 7.8, 8.4, fur, 14, 0.26, 61, 0.35);
  // 뾰족한 주둥이
  ctx.fillStyle = line; ctx.beginPath(); ctx.moveTo(4, -5.2); ctx.quadraticCurveTo(10, -3.6, 13.6, -0.8); ctx.lineTo(13.6, 0.8); ctx.quadraticCurveTo(10, 3.6, 4, 5.2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = fur; ctx.beginPath(); ctx.moveTo(4, -4.4); ctx.quadraticCurveTo(9.6, -3, 12.8, -0.6); ctx.lineTo(12.8, 0.6); ctx.quadraticCurveTo(9.6, 3, 4, 4.4); ctx.closePath(); ctx.fill();
  circle(13.2, 0, 2.1, '#1f1f1f');
  for (const s of [-1, 1]) { ell(3.6, s * 3.9, 1.9, 1.5, '#1f1f1f', s * 0.35); circle(4.1, s * 3.9 - 0.5, 0.6, '#fff'); }
  if (o.state === 'chase') ell(10, 2.6, 2.4, 1.6, '#ff7b9c');
  ctx.restore();
  ctx.restore();
}

function drawDog(d) {
  const x = d.x, y = sy(d.y);
  ell(x + 3, y + 6, 22, 13, 'rgba(0,0,0,.16)');
  if (G.inv > 0 && Math.floor(G.time * 12) % 2) ctx.globalAlpha = .5;
  drawSpitz(x, y, d.ang, { moving: Math.hypot(d.vx, d.vy) > 20, step: d.step, state: d.state, hap: G.hap, time: G.time });
  ctx.globalAlpha = 1;
  // 상태 아이콘
  if (d.state === 'chase') {
    text('💢', x + 14, y - 26, 18);
    // 진정 게이지
    if (d.calmP > 0) {
      rr(x - 22, y + 18, 44, 7, 3, 'rgba(0,0,0,.35)');
      rr(x - 22, y + 18, 44 * Math.min(1, d.calmP / 1.1), 7, 3, '#69f0ae');
    }
  } else if (d.state === 'poop') text('💩', x, y - 26, 16);
  else if (d.state === 'sniff') text('👃', x + 12, y - 24, 14);
  else if (G.hap > 85 && Math.sin(G.time * 2) > 0.6) text('♥', x + 12, y - 22, 14, '#ff6b8b');
}

function drawLeash() {
  const o = G.owner, d = G.dog;
  const fx = Math.cos(o.face), fy = Math.sin(o.face);
  const hx = o.x - fy * 13 + fx * 6, hy = o.y + fx * 13 + fy * 6;
  const cx = d.x + Math.cos(d.ang) * 13, cy = d.y + Math.sin(d.ang) * 13;
  const L = G.pull ? 72 : 135;
  const l = Math.hypot(cx - hx, cy - hy);
  const slack = Math.max(0, L - l);
  const mx = (hx + cx) / 2, my = (hy + cy) / 2;
  const px = l > 0 ? -(cy - hy) / l : 0, py = l > 0 ? (cx - hx) / l : 0;
  const sag = Math.min(38, slack * 0.45) * (1 + Math.sin(G.time * 3) * 0.08);
  const taut = slack < 3;
  ctx.strokeStyle = taut && G.dog.state === 'chase' ? '#ff2b2b' : '#d43c3c';
  ctx.lineWidth = taut ? 3 : 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hx, sy(hy)); ctx.quadraticCurveTo(mx + px * sag, sy(my + py * sag), cx, sy(cy)); ctx.stroke();
}

const MAN = { shirt: '#4f86d9', shirt2: '#5c95e8', pants: '#3d3d4d', hair: '#2a2320', long: false };
const WOMAN = { shirt: '#f07fa4', shirt2: '#f799b8', pants: '#5a4a6a', hair: '#5a3522', long: true };

function drawPerson(p, walking) {
  const look = p.man ? MAN : WOMAN, holding = p === G.owner;
  const x = p.x, y = sy(p.y);
  ell(x + 3, y + 6, 18, 14, 'rgba(0,0,0,.18)');
  if (G.inv > 0 && Math.floor(G.time * 12) % 2) ctx.globalAlpha = .5;
  ctx.save(); ctx.translate(x, y); ctx.rotate(p.face);
  const st = walking ? Math.sin(p.anim) * 7 : 0;
  // 발
  ell(st, -6, 6, 3.5, look.pants); ell(-st, 6, 6, 3.5, look.pants);
  // 팔 (남자는 오른손에 목줄)
  ell(-st * .5, -15, 5, 3.5, '#f1c7a0');
  if (holding) ell(6, 13, 5, 3.5, '#f1c7a0'); else ell(st * .5, 15, 5, 3.5, '#f1c7a0');
  // 몸
  ell(0, 0, look.long ? 8 : 9, look.long ? 13.5 : 15, look.shirt);
  ell(-2, 0, 4.5, look.long ? 9.5 : 11, look.shirt2);
  // 머리
  if (look.long) {
    ell(-8, 0, 8, 7, look.hair);                 // 어깨까지 내려온 머리
    circle(-14, 0, 4, look.hair);                // 묶은 머리
    ell(-15, 0, 2, 4.5, '#ffd34d');              // 머리끈
  }
  circle(1, 0, 8.5, '#f1c7a0');
  ctx.fillStyle = look.hair; ctx.beginPath(); ctx.arc(0, 0, 8.8, Math.PI * 0.45, Math.PI * 1.55); ctx.fill();
  circle(-1, 0, look.long ? 7 : 6.5, look.hair);
  ctx.restore();
  ctx.globalAlpha = 1;
}
function drawOwner() {
  const o = G.owner;
  drawPerson(o, o.moving || G.dragT > 0);
  if (G.dragT > 0.4) text('으아아!', o.x, sy(o.y) - 30, 14, '#fff');
}
function drawPartner() {
  const p = G.partner; drawPerson(p, p.moving);
  if (p.task) text('🧻', p.x + 14, sy(p.y) - 22, 14);
}

function drawFx() {
  for (const f of G.fx) {
    ctx.globalAlpha = Math.min(1, f.life * 1.5);
    const y = sy(f.y);
    if (f.kind === 'heart') text('♥', f.x, y, 16, '#ff6b8b');
    else if (f.kind === 'star') text('✦', f.x, y, 14, '#fff59d');
    else if (f.kind === 'smell') { ctx.strokeStyle = 'rgba(200,255,180,.8)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(f.x, y, 3, 0, Math.PI * 2); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  for (const t of G.texts) {
    ctx.globalAlpha = Math.min(1, t.life * 1.5);
    textOutline(t.t, t.x, sy(t.y), t.size, t.col);
  }
  ctx.globalAlpha = 1;
}

function drawWarnings() {
  for (const it of G.items) {
    if (it.type === 'bike' && sy(it.y) < -10 && sy(it.y) > -320) {
      if (Math.floor(G.time * 6) % 2) continue;
      rr(it.x - 22, 100, 44, 30, 8, 'rgba(255,82,82,.9)');
      text('🚲', it.x, 116, 18);
      ctx.fillStyle = 'rgba(255,82,82,.9)'; ctx.beginPath(); ctx.moveTo(it.x - 7, 130); ctx.lineTo(it.x + 7, 130); ctx.lineTo(it.x, 138); ctx.fill();
    }
  }
}

function drawHUD() {
  rr(10, 10, 460, 80, 16, 'rgba(255,255,255,.9)');
  ctx.font = `22px ${FONT}`; ctx.textAlign = 'center';
  for (let i = 0; i < 3; i++) { ctx.globalAlpha = i < G.hearts ? 1 : .2; ctx.fillText('❤️', 30 + i * 28, 34); }
  ctx.globalAlpha = 1;
  text('점수 ' + G.score, 456, 34, 21, '#333', 'right');
  // 기분
  const h = G.hap;
  text(h > 70 ? '😆' : h > 40 ? '🙂' : h > 20 ? '😐' : '😢', 30, 66, 20);
  text('꾸꾸', 48, 66, 13, '#666', 'left');
  rr(80, 59, 130, 14, 7, '#e6e6e6');
  const hc = h > 50 ? '#4caf50' : h > 25 ? '#ffb300' : '#f44336';
  if (h > 1) rr(80, 59, 130 * h / 100, 14, 7, hc);
  if (h < 25 && Math.floor(G.time * 4) % 2) rr(80, 59, 130, 14, 7, null, '#f44336');
  // 거리
  text('🐾', 232, 66, 15);
  const p = Math.min(1, dist() / GOAL);
  rr(246, 59, 140, 14, 7, '#e6e6e6');
  if (p > 0.02) rr(246, 59, 140 * p, 14, 7, '#ff8a50');
  text('🏁', 398, 66, 15);
  text(Math.floor(dist()) + 'm', 456, 66, 13, '#666', 'right');
  // 목줄 잡은 사람
  rr(10, 96, 128, 24, 8, 'rgba(255,255,255,.75)');
  text('🦮 목줄: ' + who(G.owner), 74, 109, 13, G.owner.man ? '#2f5fa8' : '#c2416f');
  // 일시정지 버튼
  rr(430, 96, 36, 24, 8, 'rgba(255,255,255,.7)'); text('❚❚', 448, 109, 12, '#555');

  if (G.msg) {
    ctx.globalAlpha = Math.min(1, G.msg.life * 2);
    ctx.font = `bold 17px ${FONT}`;
    const w = Math.min(450, ctx.measureText(G.msg.t).width + 36);
    rr(240 - w / 2, 148, w, 38, 19, 'rgba(40,40,60,.82)');
    text(G.msg.t, 240, 168, 17, '#fff');
    ctx.globalAlpha = 1;
  }
}

function drawTouchUI() {
  if (!isTouch) return;
  if (joy.active) {
    ctx.globalAlpha = .35; circle(joy.ox, joy.oy, 55, '#fff'); ctx.globalAlpha = .7; circle(joy.x, joy.y, 24, '#fff'); ctx.globalAlpha = 1;
  } else {
    ctx.globalAlpha = .5; text('화면을 드래그해서 이동', 120, 760, 14, '#fff'); ctx.globalAlpha = 1;
  }
  for (const b of [btnPick, btnPull, btnSwap]) {
    const on = b === btnPull ? b.down : b.id !== null;
    ctx.globalAlpha = on ? .95 : .7;
    circle(b.x, b.y, b.r, b === btnPull ? (on ? '#ffca28' : '#fff') : '#fff');
    ctx.globalAlpha = 1;
    text(b.icon, b.x, b.y - 8, b === btnPick ? 24 : 20);
    text(b === btnPick && !G.owner.man ? '남자 줍기' : b.label, b.x, b.y + 18, 13, '#444');
  }
}

function panel(y, h) {
  ctx.fillStyle = 'rgba(30,50,30,.45)'; ctx.fillRect(0, 0, W, H);
  rr(36, y, 408, h, 24, 'rgba(255,253,246,.97)');
}

function drawTitle() {
  panel(150, 500);
  { const t = performance.now() / 1000; ctx.save(); ctx.translate(226, 214); ctx.scale(1.9, 1.9); drawSpitz(0, 0, 0, { moving: true, step: t * 9, state: 'walk', hap: 100, time: t }); ctx.restore(); }
  text('꾸꾸산책', 240, 280, 42, '#e0703a');
  text('하얀 스피츠 꾸꾸와 둘이서 공원 산책!', 240, 320, 16, '#777', 'center', 'normal');
  const lines = [
    ['🦴', '간식을 먹고 👃 냄새를 맡으면 꾸꾸 기분 UP'],
    ['💩', '응가는 남자가 치워요  (E / 줍기)'],
    ['🔁', '목줄은 둘이 번갈아 잡아요  (Q / 교대)'],
    ['🐿️', '다람쥐가 나타나면 꽉 잡기  (Space 꾹)'],
    ['🚲', '자전거와 부딪히지 않게 조심 (세 명 모두!)'],
    ['🎮', '이동: 방향키·WASD / 터치 드래그'],
  ];
  lines.forEach(([ic, t], i) => {
    const y = 362 + i * 36;
    rr(62, y - 16, 356, 32, 10, '#f3ecd9');
    text(ic, 84, y + 1, 18); text(t, 106, y + 1, 14, '#555', 'left', '600');
  });
  if (best) text('최고 점수 ' + best, 240, 588, 14, '#999');
  ctx.globalAlpha = .6 + Math.sin(performance.now() / 300) * .4;
  rr(130, 605, 220, 34, 17, '#ff8a50'); text('탭 또는 Space로 시작', 240, 623, 16, '#fff');
  ctx.globalAlpha = 1;
}

function drawOver() {
  panel(200, 380);
  text('😢', 240, 260, 52);
  text('산책 끝…', 240, 320, 34, '#c0504d');
  text(G.reason, 240, 360, 16, '#666', 'center', '600');
  text(`이동 거리 ${Math.floor(dist())}m / ${GOAL}m`, 240, 400, 15, '#777', 'center', 'normal');
  text('점수 ' + G.total, 240, 450, 30, '#333');
  text('최고 점수 ' + best, 240, 485, 14, '#999');
  ctx.globalAlpha = .6 + Math.sin(performance.now() / 300) * .4;
  rr(140, 520, 200, 34, 17, '#ff8a50'); text('다시 산책하기', 240, 538, 16, '#fff');
  ctx.globalAlpha = 1;
}

function drawClear() {
  panel(150, 500);
  text('🎉 산책 완료! 🎉', 240, 205, 32, '#e0703a');
  ctx.font = `40px ${FONT}`;
  for (let i = 0; i < 3; i++) { ctx.globalAlpha = i < G.stars ? 1 : .18; text('⭐', 180 + i * 60, 258, 40); }
  ctx.globalAlpha = 1;
  const rows = [
    ['🦴 먹은 간식', G.bones + '개'],
    ['👃 냄새 맡기', G.sniffs + '곳'],
    ['💩 치운 응가', G.picked + '개' + (G.missed ? ` (놓침 ${G.missed})` : '')],
    ['✊ 기다려 성공', G.goodBoy + '번'],
    ['🔁 목줄 교대', G.swaps + '번'],
    ['산책 점수', G.score],
    ['기분 보너스', '+' + G.bonusHap],
    ['하트 보너스', '+' + G.bonusHeart],
  ];
  rows.forEach(([a, b], i) => {
    const y = 302 + i * 27;
    text(a, 80, y, 15, '#666', 'left', '600'); text(String(b), 400, y, 15, '#333', 'right');
  });
  ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(70, 520); ctx.lineTo(410, 520); ctx.stroke();
  text('총점 ' + G.total, 240, 550, 28, '#333');
  text((G.total >= best ? '🏆 최고 기록! ' : '최고 점수 ' + best), 240, 580, 14, '#999');
  ctx.globalAlpha = .6 + Math.sin(performance.now() / 300) * .4;
  rr(140, 600, 200, 34, 17, '#ff8a50'); text('한 번 더 산책하기', 240, 618, 16, '#fff');
  ctx.globalAlpha = 1;
}

function render() {
  ctx.setTransform(S * DPR, 0, 0, S * DPR, 0, 0);
  ctx.textBaseline = 'middle';
  ctx.save();
  if (G.shake > 0) ctx.translate(rand(-5, 5) * G.shake * 2, rand(-5, 5) * G.shake * 2);
  drawGround();
  for (const f of G.decor) if (f.type === 'flowers') drawFlowers(f);
  for (const it of G.items) {
    if (it.type === 'spot') drawSpot(it);
    else if (it.type === 'bone') drawBone(it);
    else if (it.type === 'poop') drawPoop(it);
  }
  drawPartner();
  drawDog(G.dog);
  drawLeash();
  drawOwner();
  for (const it of G.items) {
    if (it.type === 'bike') drawBike(it);
    else if (it.type === 'squirrel') drawSquirrel(it);
  }
  for (const t of G.decor) if (t.type === 'tree') drawTree(t);
  drawFx();
  ctx.restore();

  if (state === 'title') { drawTitle(); return; }
  drawWarnings();
  drawHUD();
  if (state === 'play') drawTouchUI();
  if (state === 'pause') { panel(320, 160); text('일시정지', 240, 375, 30, '#555'); text('탭 또는 P로 계속', 240, 425, 15, '#888', 'center', 'normal'); }
  if (state === 'over') drawOver();
  if (state === 'clear') drawClear();
}

// ---------- 루프 ----------
newGame(); G.msg = null;
// 타이틀 배경용 장식
for (let y = 200; y > -H; y -= rand(45, 85)) spawnDecor(y);
G.nextDecorY = -H;
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  else if (state === 'title') G.time += dt;
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
